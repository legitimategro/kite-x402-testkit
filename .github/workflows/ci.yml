name: contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node src/main.mjs --profile offline
      - uses: actions/upload-artifact@v4
        with:
          name: offline-evidence
          path: reports/
